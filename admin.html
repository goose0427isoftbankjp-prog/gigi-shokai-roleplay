<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事例追加フォーム（管理者用）</title>
<style>
  body{font-family:sans-serif; max-width:640px; margin:0 auto; padding:20px 16px 60px; background:#F5F5F0; color:#222;}
  h1{font-size:20px;}
  p.note{font-size:13px; color:#666; line-height:1.7;}
  label{display:block; font-size:13px; font-weight:bold; margin:16px 0 4px;}
  input[type=text], textarea, select{
    width:100%; padding:8px 10px; font-size:14px; border:1px solid #bbb; border-radius:4px;
    box-sizing:border-box; font-family:inherit;
  }
  textarea{resize:vertical;}
  button{
    margin-top:20px; padding:10px 20px; font-size:14px; border:none; border-radius:4px;
    background:#1F2E3D; color:#fff; cursor:pointer;
  }
  #output{margin-top:20px;}
  #output textarea{height:260px; font-family:monospace; font-size:12.5px; background:#111; color:#dfe; }
  .hint{font-size:12px; color:#888; margin-top:4px;}
  .hidden{display:none;}
  .copy-btn{margin-top:8px; background:#2F6E62;}
</style>
</head>
<body>
<h1>疑義照会ロールプレイ — 事例追加フォーム</h1>
<p class="note">
  ここに入力すると、下に貼り付け用のテキストが自動で生成されます。<br>
  生成されたテキストをコピーして、GitHubの <code>scenarios.json</code> を開き、
  一番最後の <code>}</code> の直後・ファイル最後の <code>]</code> の直前に貼り付けて保存(Commit changes)してください。
</p>

<label>タイトル（事例一覧に出る見出し）</label>
<input type="text" id="f-title" placeholder="例: 抗凝固薬との相互作用">

<label>診療科</label>
<input type="text" id="f-dept" placeholder="例: 循環器内科">

<label>難易度（1〜3）</label>
<select id="f-stars">
  <option value="1">1（易しい）</option>
  <option value="2" selected>2（普通）</option>
  <option value="3">3（難しい）</option>
</select>

<label>患者情報</label>
<textarea id="f-patient" rows="2" placeholder="例: 68歳男性。〇〇のため受診。"></textarea>

<label>処方内容（1行に1剤ずつ入力）</label>
<textarea id="f-drugs" rows="3" placeholder="例:&#10;〇〇錠100mg 1回1錠 1日2回 朝夕食後 14日分"></textarea>

<label>医師の性格・対応スタイル</label>
<textarea id="f-persona" rows="3" placeholder="例: 普段は温厚だが、外来が混んでいると早口になる循環器内科医。根拠を示せば納得しやすい。"></textarea>

<label>本来指摘すべき疑義点（AIだけが知っている正解）</label>
<textarea id="f-issue" rows="4" placeholder="例: 〇〇と△△は併用禁忌。□□への変更、または休薬期間の確認が必要。"></textarea>
<div class="hint">※ここが振り返り評価の採点基準になります。具体的な根拠（数値・相互作用・既往歴など）を書いてください。</div>

<button onclick="generate()">貼り付け用テキストを作成</button>

<div id="output" class="hidden">
  <label>↓このテキストをコピーして scenarios.json に貼り付けてください</label>
  <textarea id="out-text" readonly></textarea>
  <button class="copy-btn" onclick="copyOutput()">コピーする</button>
  <div class="hint" id="copy-status"></div>
</div>

<script>
function esc(s){ return String(s || ''); }

function generate(){
  const title = esc(document.getElementById('f-title').value).trim();
  const dept = esc(document.getElementById('f-dept').value).trim();
  const stars = Number(document.getElementById('f-stars').value) || 2;
  const patient = esc(document.getElementById('f-patient').value).trim();
  const drugsRaw = esc(document.getElementById('f-drugs').value).trim();
  const persona = esc(document.getElementById('f-persona').value).trim();
  const issue = esc(document.getElementById('f-issue').value).trim();

  const drugs = drugsRaw.split('\n').map(s=>s.trim()).filter(Boolean);

  const id = 'custom-' + Date.now();

  const obj = {
    id, title, dept, stars, patient, drugs, persona, issue
  };

  const json = JSON.stringify(obj, null, 2)
    .split('\n')
    .map((line, i) => i === 0 ? line : '  ' + line)
    .join('\n');

  const text = ',\n  ' + json;

  document.getElementById('out-text').value = text;
  document.getElementById('output').classList.remove('hidden');
  document.getElementById('copy-status').textContent = '';
}

function copyOutput(){
  const ta = document.getElementById('out-text');
  ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    document.getElementById('copy-status').textContent = 'コピーしました。scenarios.jsonの最後の "}" の後、"]" の前に貼り付けてください。';
  }).catch(()=>{
    document.getElementById('copy-status').textContent = '自動コピーに失敗しました。テキストを選択して手動でコピーしてください。';
  });
}
</script>
</body>
</html>
